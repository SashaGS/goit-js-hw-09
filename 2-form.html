<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <!-- <link rel="stylesheet" href="./css/container.css" /> -->
    <script type="module" crossorigin src="/goit-js-hw-09/2-form.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-09/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-09/assets/styles-CNNNkz0I.css">
  </head>
  <body>
    <main>
      <div class="container">
        <a class="back-link" href="./index.html">Go back</a>
        <h1 class="main-title">
          <span class="main-title-gradient">Welcome</span> to Form
        </h1>
        <form class="feedback-form" id="feedback-form" autocomplete="off">
          <label for="email">Email</label>
          <input
            class="form-input-email"
            type="email"
            id="email"
            name="email"
            autofocus
          />
          <label for="message">Message</label>
          <textarea
            class="form-message"
            name="message"
            id="message"
            rows="8"
          ></textarea>

          <button class="form-btn" type="submit">Submit</button>
        </form>
      </div>
    </main>
  </body>
</html>
